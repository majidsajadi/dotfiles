# Use C-a as the command prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes using | and -, starting in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new windows in the current pane's directory.
bind c new-window -c "#{pane_current_path}"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Display active and inactive pane borders consistently.
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=brightblack'

# Display the status bar with a black background.
set -g status-style 'bg=black'

# Separate the session name from the window list.
set -g status-left ' #S '
set -g status-left-style 'fg=brightblack,bg=black'

# Hide status information from the right side.
set -g status-right ''

# Display inactive windows as index:name.
set -g window-status-format ' #I:#W '
set -g window-status-style 'fg=brightblack,bg=black'

# Display the active window with brighter text.
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'fg=white,bg=black'
